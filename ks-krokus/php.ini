; Production overrides used by Railway Railpack / FrankenPHP.
; Keep the PHP envelope above Laravel's 6 MB per-image validation limit.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off

max_execution_time = 60
max_input_time = 120
memory_limit = 256M

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On

variables_order = "GPCS"
request_order = "GP"
default_charset = "UTF-8"

post_max_size = 85M
file_uploads = On
upload_max_filesize = 8M
max_file_uploads = 20

allow_url_fopen = On
allow_url_include = Off

session.use_strict_mode = 1
zend.assertions = -1
